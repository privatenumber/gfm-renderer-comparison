[package]
name = "markdown-rs-node"
version = "0.0.0"
edition = "2021"
publish = false

# Build a C-compatible dynamic library; build.ts copies it to `binding.node`,
# which Node loads as an N-API addon.
[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "2"
napi-derive = "2"
# wooorm's Rust port of micromark/remark (the `markdown` crate).
markdown = "1"

[profile.release]
lto = true
